version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=trading_platform_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    networks:
      - internal

  redis:
    image: redis:6.2-alpine
    networks:
      - internal

  backend:
    build:
      context: ./backend
    command: /bin/sh -c "python manage.py migrate --no-input && python manage.py collectstatic --no-input && gunicorn trading_platform.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - internal

  celery:
    build:
      context: ./backend
    command: celery -A trading_platform worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - backend
    networks:
      - internal

  celery-beat:
    build:
      context: ./backend
    command: celery -A trading_platform beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - backend
      - db
    networks:
      - internal

  flower:
    build:
      context: ./backend
    command: celery -A trading_platform flower --port=5555
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower-tradingproject.rule=Host(`flower-tradingproject.jm.ordago.local`)"
      - "traefik.http.routers.flower-tradingproject.tls=true"
      - "traefik.http.routers.flower-tradingproject.tls.certresolver=myresolver"
      - "traefik.http.services.flower-tradingproject.loadbalancer.server.port=5555"
      - "traefik.docker.network=webgateway"

  frontend:
    build:
      context: ./frontend
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - frontend_build:/var/www/frontend
      - static_volume:/var/www/static
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trading-platform.rule=Host(`web-tradingproject.jm.ordago.local`)" 
      - "traefik.http.routers.trading-platform.tls=true"
      - "traefik.http.routers.trading-platform.tls.certresolver=myresolver" 
      - "traefik.http.services.trading-platform.loadbalancer.server.port=80"

  mail:
    image: mailhog/mailhog
    ports:
      - "1026:1025"  # SMTP port (externe:interne)
      - "8026:8025"  # Web UI port (externe:interne)
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog-tradingproject.jm.ordago.local`)"
      - "traefik.http.routers.mailhog.tls=true"
      - "traefik.http.routers.mailhog.tls.certresolver=myresolver"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"
      - "traefik.docker.network=webgateway" 
    

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/root/.pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    labels:
      traefik.docker.network: "webgateway"
      traefik.enable: true
    links:
      - db:pgsql-server
    networks:
      - webgateway
      - internal

volumes:
  postgres_data:
  frontend_build:
  static_volume:
  pgadmin_data:

networks:
  internal:
    driver: bridge
  webgateway:
    external: true
